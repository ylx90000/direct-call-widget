name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build collection-disabled APK
        run: ./gradlew assembleCollectionDisabledDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Direct-Call-Widget-APK
          path: app/build/outputs/apk/collectionDisabled/debug/*.apk
